<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3b2a40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Nooklings: Little Worlds</title>
  </head>
  <body>
    <div id="app">
      <nav id="rail" aria-label="Main">
        <button class="tab active" data-tab="home" aria-label="Home"><span class="ico">⌂</span><span class="lbl">Home</span><i class="badge" hidden></i></button>
        <button class="tab" data-tab="nookbook" aria-label="Nookbook"><span class="ico">❦</span><span class="lbl">Book</span><i class="badge" hidden></i></button>
        <button class="tab" data-tab="explore" aria-label="Explore"><span class="ico">✦</span><span class="lbl">Explore</span><i class="badge" hidden></i></button>
        <button class="tab" data-tab="tasks" aria-label="Tasks"><span class="ico">✓</span><span class="lbl">Tasks</span><i class="badge" hidden></i></button>
      </nav>
      <main id="main">
        <header id="topbar">
          <div id="home-title">
            <span id="home-name">Little Cottage</span>
            <span class="lvl" id="lvl">Lv 1</span>
            <span class="hearts" title="Home Hearts"><span class="hearts-bar"><span id="hearts-fill"></span></span><span id="hearts-text">0/10</span></span>
          </div>
          <div id="resources">
            <button class="res" id="res-buttons-btn" aria-label="Buttons"><span class="res-ico" data-icon="buttons">●</span><b id="res-buttons">0</b></button>
            <button class="res" id="res-stamps-btn" aria-label="Wish Stamps"><span class="res-ico" data-icon="wish_stamp">✉</span><b id="res-stamps">0</b></button>
          </div>
          <div id="top-actions">
            <button id="build-btn" class="pill">Build</button>
            <button id="fs-btn" class="pill icon" aria-label="Full screen">⤢</button>
          </div>
        </header>
        <div id="stage-wrap">
          <div id="stage"></div>
          <section id="page" hidden></section>
          <div id="reveal" hidden></div>
          <div id="toast" role="status" aria-live="polite"></div>
        </div>
      </main>
      <aside id="panel" aria-live="polite" hidden></aside>
    </div>
    <div id="rotate">
      <div class="rotate-card">
        <div class="rotate-phone"></div>
        <p>Turn your phone sideways to play Nooklings</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
